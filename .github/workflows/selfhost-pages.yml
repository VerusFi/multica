name: selfhost-pages

on:
  push:
    branches: [main, feature/selfhost-in-browser]
    paths: ["deploy/selfhost-web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: selfhost-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Page assets only: dev harness, tests, the relay's unit tests and
      # node_modules never ship to Pages. relay.py / relay.sh / relay.ps1 DO
      # ship — the relay is served as static files from this site.
      - name: Stage page assets
        run: |
          mkdir -p "$RUNNER_TEMP/pages-artifact"
          rsync -a deploy/selfhost-web/ "$RUNNER_TEMP/pages-artifact/" \
            --exclude dev/ --exclude tests/ --exclude relay_test.py --exclude node_modules/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
